# The work machine (PROMPT.md section 5). Copy to ~/.config/slots/config.toml there.

[lanes]
root = "~/Documents/dev/interface"
pattern = '^(?P<ticket>\d+)$'          # lane folders are bare ticket numbers, e.g. 1234

[pool.agent]
size = 7
hold = "session"                       # held for a whole session; no inactivity timeout

[pool.test]
size = 5
hold = "command"

[lock.e2e]                             # one lane signs in as the shared test employee at a time
[lock.next-mock-core]                  # next's shared mock core

[family.next-employee]                 # one next run per test employee
name = "next-employee-{key}"           # same name as lib/env.ts nextEmployeeLock
key = "sha1-12"

[warn]
long_held_h = 12                       # "long-held" after 12 h
idle_min = 30                          # "idle?" after 30 min with no lane processes
wait_min = 60

[ports]                                # slots port <lane> <service>
range = [43000, 44999]

[protect]                              # shared; the dashboard never stops these
containers = ["be-postgres", "redis"]
ports = [5432, 6431]

[compat]                               # what agent-slot.sh, slot.sh and lib-slot.sh map onto
agent_pool = "agent"
test_pool = "test"
e2e_lock = "e2e"
employee_family = "next-employee"
undeclared_locks = true                # run_exclusive may name locks that aren't declared above

# Credential freshness (PROMPT.md section 5). Set VAULT_ADDR here or in your environment.
[watcher.vault]
kind = "credential"
command = "vault token lookup -format=json"
expiry = "data.expire_time"
warn_before = "30m"
every = "60s"
# env = { VAULT_ADDR = "https://..." }

[watcher.aws]
kind = "credential"
command = "aws sts get-caller-identity --profile pe"
every = "5m"

# The old signin-watcher.sh as a lane-setup watcher: fill in your harness's paths and command.
# [watcher.signin]
# kind = "lane-setup"
# port = "ui"                                  # each lane's `slots port <ticket> ui`
# artifact = "~/Documents/dev/interface/<harness>/.auth/<lane file>.json"
# command = "<the harness's sign-in setup>"
# cwd = "~/Documents/dev/interface/<harness>"
# success = " passed"
# locks = ["e2e"]
# settle = "20s"
# every = "30s"

[cluster]
enabled = false
