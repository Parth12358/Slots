# Development config: a throwaway root and small limits, so tests and trials are quick.
# SLOTS_HOME=/tmp/slots-dev SLOTS_CONFIG=examples/dev.toml slots status

[lanes]
root = "/tmp/slots-dev/lanes"
pattern = '^(?P<ticket>\d+)$'

[pool.agent]
size = 2
hold = "session"

[pool.test]
size = 2

[lock.e2e]
[lock.next-mock-core]

[family.next-employee]
name = "next-employee-{key}"
key = "sha1-12"
