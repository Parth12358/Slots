[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slots"
version = "0.1.0"
description = "A local coordinator for Claude Code sessions and the heavy work they run"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
slots = "slots.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
slots = ["*.toml"]
